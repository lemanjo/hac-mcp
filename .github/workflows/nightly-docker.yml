name: Publish nightly Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      - name: Check supply-chain policy
        run: node scripts/check-supply-chain.mjs

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
          driver-opts: |
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Build amd64 image for verification
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          push: false
          target: runtime
          tags: home-assistant-admin-mcp:scan-amd64

      - name: Smoke test amd64 image
        run: |
          docker run --rm --entrypoint /usr/local/bin/node home-assistant-admin-mcp:scan-amd64 --version
          docker run --rm --entrypoint /usr/bin/git home-assistant-admin-mcp:scan-amd64 --version
          if docker run --rm --entrypoint /bin/sh home-assistant-admin-mcp:scan-amd64 -c true; then
            echo "Runtime image unexpectedly contains /bin/sh" >&2
            exit 1
          fi

      - name: Report amd64 vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          version: v0.73.0
          image-ref: home-assistant-admin-mcp:scan-amd64
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "0"

      - name: Reject fixable amd64 vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          version: v0.73.0
          image-ref: home-assistant-admin-mcp:scan-amd64
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: "true"
          exit-code: "1"

      - name: Build arm64 image for verification
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: linux/arm64
          push: false
          target: runtime
          tags: home-assistant-admin-mcp:scan-arm64

      - name: Smoke test arm64 image
        run: |
          docker run --rm --entrypoint /usr/local/bin/node home-assistant-admin-mcp:scan-arm64 --version
          docker run --rm --entrypoint /usr/bin/git home-assistant-admin-mcp:scan-arm64 --version
          if docker run --rm --entrypoint /bin/sh home-assistant-admin-mcp:scan-arm64 -c true; then
            echo "Runtime image unexpectedly contains /bin/sh" >&2
            exit 1
          fi

      - name: Report arm64 vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          version: v0.73.0
          image-ref: home-assistant-admin-mcp:scan-arm64
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "0"

      - name: Reject fixable arm64 vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          version: v0.73.0
          image-ref: home-assistant-admin-mcp:scan-arm64
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: "true"
          exit-code: "1"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_NIGHTLY_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker.io/lemanjo/hac-mcp
          flavor: latest=false
          tags: |
            type=raw,value=nightly
            type=sha,prefix=nightly-,format=long

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          provenance: mode=max
          sbom: generator=docker.io/docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          target: runtime
